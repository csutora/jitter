<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>jitter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'SF Mono', 'Menlo', 'Monaco', 'Courier New', monospace;
      background: #0a0a0a;
      color: #00ff41;
      padding: 2em;
      line-height: 1.5;
    }
    h1 { color: #00ff41; margin-bottom: 0.2em; font-size: 1.5em; }
    .subtitle { color: #666; margin-bottom: 1.5em; font-size: 0.9em; }
    .controls { margin-bottom: 1em; }
    button {
      font-family: inherit;
      font-size: 1em;
      padding: 0.4em 1.2em;
      background: #1a1a1a;
      color: #00ff41;
      border: 1px solid #00ff41;
      cursor: pointer;
    }
    button:hover { background: #00ff41; color: #0a0a0a; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    #status-bar {
      display: none;
      margin-top: 0.5em;
      font-size: 0.8em;
      color: #666;
    }
    #status-bar.active { display: block; }
  </style>
</head>
<body>
  <h1>jitter</h1>
  <div class="subtitle">arm64 &rarr; wasm dynamic recompiler</div>
  <div class="controls">
    <button id="btn-shell" onclick="window.bootShell()">boot shell</button>
  </div>
  <div id="status-bar"></div>
  <script type="module">/* BUNDLE */</script>
</body>
</html>
