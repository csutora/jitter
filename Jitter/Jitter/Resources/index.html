    if (el) el.style.display = "none";
  };
  for (const id of ["controls", "status-bar"]) hide(id);
  if (document.readyState === "loading") {
    window.addEventListener("DOMContentLoaded", () => window.bootShell?.(), { once: true });
  } else {
    window.bootShell?.();
  }
}
</script>
</body>
</html>
