window.bootShell = async () => {
  const btn = document.getElementById("btn-shell");
  btn.disabled = true;
  btn.textContent = "Loading...";
  try {
    const bridge = new NativeBridge();
    if (bridge.isNative) {
      console.log("[jitter] Native bridge detected \u2014 filesystem calls will route to Swift");
    }
    let elfBytes;
    if (bridge.isNative) {
      const resp = await bridge.call("load_bundle_file", { name: "busybox-aarch64" });
      if (resp.error) throw new Error(`Failed to load busybox via bridge: ${resp.error}`);
      const binary = atob(resp.data);
      elfBytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) elfBytes[i] = binary.charCodeAt(i);
    } else {
      const resp = await fetch("busybox-aarch64");
      if (!resp.ok) throw new Error(`Failed to fetch busybox: ${resp.status}`);
      elfBytes = new Uint8Array(await resp.arrayBuffer());
    }
    document.getElementById("bench-panel").style.display = "none";
    const termContainer = document.getElementById("terminal-container");
    termContainer.classList.add("active");
    const term = new Dl({
      theme: {
        background: "#0a0a0a",
        foreground: "#00ff41",
        cursor: "#00ff41"
      },
      fontFamily: "'SF Mono', 'Menlo', 'Monaco', 'Courier New', monospace",
      fontSize: 14,
      cursorBlink: true
    });
    const fitAddon = new o();
    term.loadAddon(fitAddon);
    term.open(termContainer);
    fitAddon.fit();
    const xtermTextarea = termContainer.querySelector(".xterm-helper-textarea");
    if (xtermTextarea) {
      xtermTextarea.setAttribute("autocorrect", "off");
      xtermTextarea.setAttribute("autocomplete", "off");
      xtermTextarea.setAttribute("autocapitalize", "none");
      xtermTextarea.setAttribute("spellcheck", "false");
    }
    window.addEventListener("resize", () => fitAddon.fit());
    const statusBar = document.getElementById("status-bar");
    statusBar.classList.add("active");
    setButtons(false);
    btn.style.display = "none";
    statusBar.textContent = "Booting...";
    const useMulticore = self.crossOriginIsolated;
    if (useMulticore) {
      console.log("[jitter] Multicore mode: crossOriginIsolated=true, using Web Workers");
      statusBar.textContent = "Booting (multicore)...";
      const kernel = new Kernel({
        elfBytes,
        workerURL: "worker.js",
        onOutput: (data) => {
          term.write(translateNewlines(data));
        },
        bridge: bridge.isNative ? bridge : void 0
      });
      term.onData((data) => {
        if (data === "") {
          kernel.sendInterrupt();
          term.write("^C\r\n");
          return;
        }
        kernel.pushStdin(new TextEncoder().encode(data));
      });
      kernel.boot(
        ["sh"],
        ["HOME=/root", "TERM=xterm-256color", "PATH=/bin", "PWD=/"]
      );
      statusBar.textContent = "Running (multicore)";
      return;
    }
    console.log("[jitter] Single-thread mode: crossOriginIsolated=false, using main thread emulator");
    const io = new IOManager();
    term.onData((data) => {
      if (data === "") {
        io.interrupted = true;
        term.write("^C\r\n");
      }
      io.pushStdin(new TextEncoder().encode(data));
    });
    const emu = new Emulator(1024);
    emu.singleBlockMode = true;
    emu.io = io;
    const vfs = new InMemoryVFS();
    vfs.loadBinary(elfBytes);
    const elfInfo = loadElf(elfBytes, emu.memory);
    const sp = setupStack(
      emu.memory,
      elfInfo,
      ["sh"],
      ["HOME=/root", "TERM=xterm-256color", "PATH=/bin", "PWD=/"]
    );
    emu.cpu.setSP(sp);
    const tlsArea = 9437184;
    const tlsView = new DataView(emu.memory.buffer);
    tlsView.setBigUint64(TPIDR_OFFSET, BigInt(tlsArea), true);
    const syscalls = new SyscallHandler(
      elfInfo.brkStart,
      {
        writeStdout: (data) => {
          term.write(translateNewlines(data));
        },
        writeStderr: (data) => {
          term.write(translateNewlines(data));
        },
        readStdin: (count) => {
          return io.readStdin(count);
        }
      },
      vfs,
      bridge
    );
    syscalls.setTermSize(term.cols, term.rows);
    term.onResize(({ cols, rows }) => {
      syscalls.setTermSize(cols, rows);
    });
    emu.syscallHandler = (cpu, memory) => syscalls.handle(cpu, memory);
    emu.syscallHandlerInstance = syscalls;
    emu.elfBytes = elfBytes;
    emu.bridge = bridge;
    let booted = false;
    const result = await emu.runAsync(
      elfInfo.entry,
      async () => {
        if (!booted) {
          booted = true;
          statusBar.textContent = "Running";
        }
        await io.waitForStdin();
      },
      (code) => {
        term.write(`\r
[Process exited with code ${code}]\r
`);
        statusBar.textContent = `Exited (code ${code})`;
      }
    );
    statusBar.textContent = `Shell exited \u2014 ${result.insns.toLocaleString()} instructions executed`;
  } catch (err) {
    console.error("Boot failed:", err);
    const output2 = document.getElementById("output");
    output2.textContent = `Boot failed: ${err.message}

Make sure busybox-aarch64 is in the dist/ directory.`;
    btn.disabled = false;
    btn.textContent = "Boot Shell";
  }
};
